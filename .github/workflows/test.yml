name: Pruebas

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # fixed: ubuntu-latest moved to Ubuntu 26 (19-10-2026), where installing Chromium for Playwright can fail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: npm test
